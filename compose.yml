name: qreven-kelas
services:
    app:
        image: qreven-kelas:demo
        build: .
        command: ["sh", "-ec", "php artisan migrate --force && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"]
        ports:
            - "127.0.0.1:8080:8000"
        environment:
            APP_NAME: Qreven
            APP_ENV: local
            APP_DEBUG: "false"
            APP_URL: http://localhost:8080
            APP_KEY: ${APP_KEY:?Isi APP_KEY Laravel di .env}
            DB_CONNECTION: mariadb
            DB_HOST: db
            DB_PORT: "3306"
            DB_DATABASE: qreven
            DB_USERNAME: qreven
            DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: sync
            LOG_CHANNEL: stderr
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
            GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
            GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
            GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - app-storage:/srv/app/storage
    db:
        image: mariadb:13.0.2
        environment:
            MARIADB_DATABASE: qreven
            MARIADB_USER: qreven
            MARIADB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
            MARIADB_RANDOM_ROOT_PASSWORD: "yes"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 25s
volumes:
    mysql-data:
    app-storage:
